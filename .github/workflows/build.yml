name: build

# 长流：core 单测 + 调试 APK。调试签名提交在仓库里（app/debug.keystore），CI 不需要任何密钥。
# API key 不在 CI 里出现：它只存在用户手机的加密设置里。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Core / 一手 / 总控 unit tests + debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          # 融合模块直接编译 src-ref 源树；CI 需要先把 yishou / zongkong 源码放到这个目录
          LEGACY_ROOT: ${{ github.workspace }}/legacy
        run: ./gradlew :core:test :ys:testDebugUnitTest :zk:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changliu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            core/build/test-results/test/
            ys/build/test-results/testDebugUnitTest/
            zk/build/test-results/testDebugUnitTest/
          if-no-files-found: warn